<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Shell -->
  <rect width="512" height="512" rx="112" fill="#131B2E"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#3B82F6" stroke-width="12" stroke-opacity="0.5"/>

  <!-- Calculator Inset Screen Display -->
  <rect x="72" y="72" width="368" height="112" rx="28" fill="#090D16" stroke="#26334A" stroke-width="8"/>
  
  <!-- Subtle Display Digits Indicator -->
  <rect x="96" y="112" width="20" height="32" rx="4" fill="#3B82F6" fill-opacity="0.8"/>
  <rect x="126" y="104" width="24" height="40" rx="4" fill="#F8FAFC" fill-opacity="0.9"/>
  <rect x="160" y="120" width="16" height="24" rx="4" fill="#F8FAFC" fill-opacity="0.6"/>

  <!-- Display Mode Indicator Badge -->
  <rect x="368" y="88" width="56" height="20" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4"/>
  <text x="396" y="102" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PRO</text>

  <!-- Keypad Grid Row 1 -->
  <rect x="72" y="216" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="164" y="216" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="256" y="216" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="348" y="216" width="92" height="64" rx="16" fill="#F59E0B"/>

  <!-- Keypad Grid Row 2 -->
  <rect x="72" y="304" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="164" y="304" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="256" y="304" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="348" y="304" width="92" height="64" rx="16" fill="#2563EB"/>

  <!-- Keypad Grid Row 3 -->
  <rect x="72" y="392" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="164" y="392" width="76" height="64" rx="16" fill="#1E293B" stroke="#26334A" stroke-width="4"/>
  <rect x="256" y="392" width="76" height="64" rx="16" fill="#10B981"/>
  <rect x="348" y="392" width="92" height="64" rx="16" fill="#3B82F6"/>
</svg>
